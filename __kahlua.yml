version: "1.1"
languages:
  lua:
    tags: [StubGen_Definitions]
    tables:
      string:
        tags: [StubGen_NoInitializer]
        staticMethods:
          - name: trim
            parameters:
              - name: str
                type: string
            return:
              - type: string
          - name: split
            parameters:
              - name: str
                type: string
              - name: regex
                type: string
            return:
              - type: string[]
          - name: sort
            parameters:
              - name: str
                type: string
              - name: other
                type: string
            return:
              - type: boolean
          - name: contains
            parameters:
              - name: str
                type: string
              - name: other
                type: string
            return:
              - type: boolean
      table:
        tags: [StubGen_NoInitializer]
        staticMethods:
          - name: isempty
            parameters:
              - name: table
                type: table
            return:
              - type: boolean
          - name: wipe
            parameters:
              - name: table
                type: table
          - name: newarray
            parameters:
              - name: "..."
                type: any
            return:
              - type: table
            overloads:
              - parameters:
                  - name: table
                    type: table
                return:
                  - type: table
    classes:
      Random:
        local: true
        mutable: false
        methods:
          - name: random
            parameters:
              - name: m
                type: number
                nullable: true
              - name: n
                type: number
                nullable: true
            return:
              - type: number
            overloads:
              - parameters:
                - name: m
                  type: integer
                return:
                  - type: integer
              - parameters:
                - name: m
                  type: integer
                - name: n
                  type: integer
                return:
                  - type: integer
          - name: seed
            parameters:
              - name: value
                type: unknown
                nullable: true
    functions:
      - name: debugstacktrace
        parameters:
          - name: thread
            type: thread
            nullable: true
          - name: level
            type: integer
            nullable: true
          - name: maxLines
            type: integer
            nullable: true
          - name: maxLevel
            type: integer
            nullable: true
        return:
          - type: string
      - name: bytecodeloader
        parameters:
          - name: loader
            type: string
        return:
          - type: string | function
            nullable: true
      - name: newrandom
        return:
          - type: Random
